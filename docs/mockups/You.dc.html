<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Murmur you</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #111214; color: #F3F1EC; font-family: 'Plus Jakarta Sans', sans-serif;">

<div style="padding: 28px 20px 0 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 2px;">
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px;">You</h1>
<div style="font-size: 13px; color: #A9A7A2;">sam</div>
</div>

<div style="display: flex; gap: 8px;">
<button style="height: 34px; padding: 0 16px; border-radius: 17px; background: #8E9BFF; color: #141833; font-size: 13px; font-weight: 700;">Week</button>
<button style="height: 34px; padding: 0 16px; border-radius: 17px; background: #212226; color: #D6D4CF; font-size: 13px; font-weight: 600;">Month</button>
<button style="height: 34px; padding: 0 16px; border-radius: 17px; background: #212226; color: #D6D4CF; font-size: 13px; font-weight: 600;">Year</button>
<button style="height: 34px; padding: 0 16px; border-radius: 17px; background: #212226; color: #D6D4CF; font-size: 13px; font-weight: 600;">All time</button>
</div>

<div style="padding: 16px; border-radius: 16px; background: #1A1B1F; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 30px; font-weight: 800; letter-spacing: -0.5px;">9h 42m</div>
<div style="font-size: 12px; color: #A9A7A2;">1h 15m more than this time last week</div>
</div>
<div role="img" aria-label="Listening per day" style="height: 84px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end;">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
<div style="height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px;">
<div style="width: 100%; height: {{b.h}}; border-radius: 4px; background: {{b.color}};"></div>
<div style="font-size: 10px; color: #7E7C78;">{{b.label}}</div>
</div>
</sc-for>
</div>
<div style="display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px;">
<div style="flex: 6; background: #8E9BFF;"></div>
<div style="flex: 2.5; background: #E3A86B;"></div>
<div style="flex: 1.5; background: #6BC4A6;"></div>
</div>
<div style="display: flex; gap: 14px; font-size: 12px;">
<span style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #8E9BFF;"></span>Books<span style="color: #A9A7A2;">5h 50m</span></span>
<span style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #E3A86B;"></span>Podcasts<span style="color: #A9A7A2;">2h 25m</span></span>
<span style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #6BC4A6;"></span>Music<span style="color: #A9A7A2;">1h 27m</span></span>
</div>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
<div style="padding: 14px; border-radius: 14px; background: #1A1B1F;"><div style="font-size: 20px; font-weight: 800;">12 days</div><div style="font-size: 12px; color: #A9A7A2;">Listening streak</div></div>
<div style="padding: 14px; border-radius: 14px; background: #1A1B1F;"><div style="font-size: 20px; font-weight: 800;">1 book</div><div style="font-size: 12px; color: #A9A7A2;">Finished this week</div></div>
</div>

<div style="display: flex; flex-direction: column;">
<div style="font-size: 12px; font-weight: 700; color: #A9A7A2; letter-spacing: 0.6px; text-transform: uppercase; padding-bottom: 4px;">Most played this week</div>
<sc-for list="{{top}}" as="t" hint-placeholder-count="3">
<div style="display: flex; gap: 12px; align-items: center; height: 60px; border-bottom: 1px solid #222327;">
<div style="width: 44px; height: 44px; border-radius: 6px; background: {{t.color}}; flex-shrink: 0;"></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{t.title}}</div>
<div style="font-size: 12px; color: #A9A7A2;">{{t.label}}</div>
</div>
<div style="font-size: 13px; color: #C9C7C2;">{{t.time}}</div>
</div>
</sc-for>
</div>
</div>

<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: #17181B; border-top: 1px solid #26272B; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #9A9AA0; font-size: 12px; font-weight: 600;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14"></path><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4H9a3 3 0 0 1 3 3 3 3 0 0 1 3-3h4.5A1.5 1.5 0 0 1 21 5.5v11a1.5 1.5 0 0 1-1.5 1.5H15a3 3 0 0 0-3 3 3 3 0 0 0-3-3H4.5A1.5 1.5 0 0 1 3 16.5z"></path></svg>Books</a>
<a href="Podcasts.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #9A9AA0; font-size: 12px; font-weight: 600;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>Podcasts</a>
<a href="Music.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #9A9AA0; font-size: 12px; font-weight: 600;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>Music</a>
<a href="Listening.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #9A9AA0; font-size: 12px; font-weight: 600;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h13M3 12h9M3 18h9"></path><path d="M16 12l5 3.5-5 3.5z"></path></svg>Listening</a>
<a href="You.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8E9BFF; font-size: 12px; font-weight: 700;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>You</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const days = [['M', 55], ['T', 80], ['W', 30], ['T', 100], ['F', 65], ['S', 90], ['S', 45]];
return {
bars: days.map(([label, pct], i) => ({ label, h: pct + '%', color: i === 6 ? '#8E9BFF' : '#3A3D4A' })),
top: [
{ title: 'Project Hail Mary', label: 'Most played book', time: '4h 10m', color: '#3B5B6E' },
{ title: 'Rumours', label: 'Most played album', time: '58m', color: '#6B4F2E' },
{ title: 'Dreams', label: 'Most played song, 6 plays', time: '25m', color: '#6B4F2E' }
]
};
}
}
</script>
</body>
</html>

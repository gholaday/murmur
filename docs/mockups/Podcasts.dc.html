<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Murmur podcasts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #111214; color: #F3F1EC; font-family: 'Plus Jakarta Sans', sans-serif;">

<div style="padding: 28px 20px 0 20px; display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px;">Podcasts</h1>
<div style="display: flex; gap: 4px;">
<button aria-label="Sort shows" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #C9C7C2;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button>
<button aria-label="Add podcast by RSS URL" style="width: 44px; height: 44px; border-radius: 22px; background: #8E9BFF; color: #141833; display: flex; align-items: center; justify-content: center;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 6px;">
<h2 style="margin: 0; font-size: 17px; font-weight: 700;">New episodes</h2>
<span style="font-size: 12px; color: #8E9BFF; font-weight: 700;">See all</span>
</div>
<sc-for list="{{newest}}" as="e" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; height: 64px;">
<div style="width: 48px; height: 48px; border-radius: 8px; background: {{e.color}}; flex-shrink: 0;"></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 11px; color: #A9A7A2; font-weight: 600;">{{e.show}}</div>
<div style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{e.title}}</div>
<div style="display: flex; gap: 10px; font-size: 12px; color: #A9A7A2;"><span>{{e.when}}</span><span>{{e.len}}</span></div>
</div>
<button aria-label="Play episode" style="width: 40px; height: 40px; border-radius: 20px; border: 1.5px solid #4A4B50; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px;"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"></path></svg></button>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 8px;">
<h2 style="margin: 0; font-size: 17px; font-weight: 700;">Your shows</h2>
<span style="display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 10px; background: #212226; color: #A9A7A2; font-size: 12px; font-weight: 700;">9</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
<sc-for list="{{shows}}" as="s" hint-placeholder-count="6">
<a href="Show.dc.html" style="position: relative; aspect-ratio: 1 / 1; border-radius: 10px; background: {{s.color}}; box-sizing: border-box; padding: 8px; display: flex; flex-direction: column; justify-content: flex-end;">
<div style="font-size: 12px; font-weight: 800; line-height: 1.15; color: #FFFDF8;">{{s.name}}</div>
<sc-if value="{{s.hasNew}}" hint-placeholder-val="{{true}}">
<span style="position: absolute; top: 6px; right: 6px; min-width: 22px; height: 22px; border-radius: 11px; background: #8E9BFF; color: #141833; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 6px; box-sizing: border-box;">{{s.unplayed}}</span>
</sc-if>
</a>
</sc-for>
</div>
</div>
</div>

<a href="Player.dc.html" style="position: absolute; left: 8px; right: 8px; bottom: 80px; height: 64px; border-radius: 14px; background: #26272C; box-shadow: 0 8px 24px rgba(0,0,0,0.45); display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; overflow: hidden;">
<div style="width: 44px; height: 44px; border-radius: 6px; background: #3B5B6E; flex-shrink: 0;"></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Project Hail Mary</div>
<div style="font-size: 12px; color: #A9A7A2; white-space: nowrap;">Chapter 23</div>
</div>
<span aria-label="Skip back 10 seconds" style="width: 40px; height: 44px; position: relative; display: flex; align-items: center; justify-content: center; color: #F3F1EC;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 30px; height: 30px; stroke-width: 1.7;"><path d="M4 12a8 8 0 1 0 2.3-5.6"></path><path d="M4 4v4h4"></path></svg><span style="position: absolute; font-size: 9px; font-weight: 800; padding-top: 2px;">10</span></span>
<span aria-label="Pause" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"></rect><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"></rect></svg></span>
<span aria-label="Skip forward 30 seconds" style="width: 40px; height: 44px; position: relative; display: flex; align-items: center; justify-content: center; color: #F3F1EC;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 30px; height: 30px; stroke-width: 1.7;"><path d="M20 12a8 8 0 1 1-2.3-5.6"></path><path d="M20 4v4h-4"></path></svg><span style="position: absolute; font-size: 9px; font-weight: 800; padding-top: 2px;">30</span></span>
<div style="position: absolute; left: 0; bottom: 0; height: 2px; width: 62%; background: #8E9BFF;"></div>
</a>

<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: #17181B; border-top: 1px solid #26272B; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #9A9AA0; font-size: 12px; font-weight: 600;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14"></path><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4H9a3 3 0 0 1 3 3 3 3 0 0 1 3-3h4.5A1.5 1.5 0 0 1 21 5.5v11a1.5 1.5 0 0 1-1.5 1.5H15a3 3 0 0 0-3 3 3 3 0 0 0-3-3H4.5A1.5 1.5 0 0 1 3 16.5z"></path></svg>Books</a>
<a href="Podcasts.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8E9BFF; font-size: 12px; font-weight: 700;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>Podcasts</a>
<a href="Music.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #9A9AA0; font-size: 12px; font-weight: 600;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>Music</a>
<a href="Listening.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #9A9AA0; font-size: 12px; font-weight: 600;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h13M3 12h9M3 18h9"></path><path d="M16 12l5 3.5-5 3.5z"></path></svg>Listening</a>
<a href="You.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #9A9AA0; font-size: 12px; font-weight: 600;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>You</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
newest: [
{ show: '99% Invisible', when: 'Today', title: 'The Shape of Sound', len: '42 min', color: '#2F5F5A' },
{ show: 'Hardcore History', when: 'Yesterday', title: 'Episode 72: Mania for Subjugation III', len: '5h 48m', color: '#7A4436' },
{ show: 'Darknet Diaries', when: '2 days ago', title: 'The Vending Machine Hack', len: '58 min', color: '#44506B' }
],
shows: [
{ name: '99% Invisible', color: '#2F5F5A', hasNew: true, unplayed: '3' },
{ name: 'Hardcore History', color: '#7A4436', hasNew: true, unplayed: '1' },
{ name: 'Darknet Diaries', color: '#44506B', hasNew: true, unplayed: '2' },
{ name: 'Radiolab', color: '#5B4A75', hasNew: false, unplayed: '' },
{ name: 'The Rest Is History', color: '#8A6A2E', hasNew: true, unplayed: '5' },
{ name: 'Planet Money', color: '#4F6B45', hasNew: false, unplayed: '' }
]
};
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Murmur music</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #111214; color: #F3F1EC; font-family: 'Plus Jakarta Sans', sans-serif;">

<div style="padding: 28px 20px 0 20px; display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px;">Music</h1>
<div style="display: flex; gap: 4px;">
<button aria-label="Search" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #C9C7C2;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
<button aria-label="Sort" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #C9C7C2;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button>
</div>
</div>

<a href="Music.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: #1A1B1F;">
<div style="width: 44px; height: 44px; border-radius: 10px; background: #212226; display: flex; align-items: center; justify-content: center; color: #8E9BFF; flex-shrink: 0;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2"></rect><rect x="3" y="14" width="18" height="6" rx="2"></rect><path d="M7 7h.01M7 17h.01"></path></svg></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 15px; font-weight: 700;">Browse</div>
<div style="font-size: 12px; color: #A9A7A2;">48 albums you haven't added</div>
</div>
<span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; background: #8E9BFF; color: #141833; font-size: 12px; font-weight: 800;">6 new</span>
<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: #7E7C78;"><path d="M9 6l6 6-6 6"></path></svg>
</a>

<div style="display: flex; gap: 8px;">
<button style="height: 34px; padding: 0 16px; border-radius: 17px; background: #8E9BFF; color: #141833; font-size: 13px; font-weight: 700;">Albums</button>
<button style="height: 34px; padding: 0 16px; border-radius: 17px; background: #212226; color: #D6D4CF; font-size: 13px; font-weight: 600;">Artists</button>
<button style="height: 34px; padding: 0 16px; border-radius: 17px; background: #212226; color: #D6D4CF; font-size: 13px; font-weight: 600;">Songs</button>
<button style="height: 34px; padding: 0 16px; border-radius: 17px; background: #212226; color: #D6D4CF; font-size: 13px; font-weight: 600;">Playlists</button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px;">
<sc-for list="{{albums}}" as="a" hint-placeholder-count="4">
<a href="Album.dc.html" style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
<div style="aspect-ratio: 1 / 1; border-radius: 10px; background: {{a.color}}; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end;">
<div style="font-size: 15px; font-weight: 800; line-height: 1.15; color: #FFFDF8;">{{a.title}}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{a.title}}</div>
<div style="font-size: 12px; color: #A9A7A2;">{{a.sub}}</div>
</div>
</a>
</sc-for>
</div>
</div>

<a href="Player.dc.html" style="position: absolute; left: 8px; right: 8px; bottom: 80px; height: 64px; border-radius: 14px; background: #26272C; box-shadow: 0 8px 24px rgba(0,0,0,0.45); display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; overflow: hidden;">
<div style="width: 44px; height: 44px; border-radius: 6px; background: #6B4F2E; flex-shrink: 0;"></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Go Your Own Way</div>
<div style="font-size: 12px; color: #A9A7A2; white-space: nowrap;">Fleetwood Mac</div>
</div>
<span aria-label="Previous song" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 5l-9 7 9 7z"></path></svg></span>
<span aria-label="Pause" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"></rect><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"></rect></svg></span>
<span aria-label="Next song" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 5l9 7-9 7z"></path></svg></span>
<div style="position: absolute; left: 0; bottom: 0; height: 2px; width: 35%; background: #8E9BFF;"></div>
</a>

<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: #17181B; border-top: 1px solid #26272B; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #9A9AA0; font-size: 12px; font-weight: 600;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14"></path><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4H9a3 3 0 0 1 3 3 3 3 0 0 1 3-3h4.5A1.5 1.5 0 0 1 21 5.5v11a1.5 1.5 0 0 1-1.5 1.5H15a3 3 0 0 0-3 3 3 3 0 0 0-3-3H4.5A1.5 1.5 0 0 1 3 16.5z"></path></svg>Books</a>
<a href="Podcasts.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #9A9AA0; font-size: 12px; font-weight: 600;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>Podcasts</a>
<a href="Music.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8E9BFF; font-size: 12px; font-weight: 700;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>Music</a>
<a href="Listening.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #9A9AA0; font-size: 12px; font-weight: 600;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h13M3 12h9M3 18h9"></path><path d="M16 12l5 3.5-5 3.5z"></path></svg>Listening</a>
<a href="You.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #9A9AA0; font-size: 12px; font-weight: 600;"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>You</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

renderVals() {
return {
albums: [
{ title: 'Rumours', sub: 'Fleetwood Mac', color: '#6B4F2E' },
{ title: 'In Rainbows', sub: 'Radiohead', color: '#7A4436' },
{ title: 'Blue', sub: 'Joni Mitchell', color: '#3E4E5A' },
{ title: 'Kind of Blue', sub: '4 of 5 songs', color: '#2F5F5A' }
]
};
}
}
</script>
</body>
</html>

</a>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const playing = 5;
const titles = [['Second Hand News', '2:43'], ['Dreams', '4:14'], ['Never Going Back Again', '2:02'], ['Don’t Stop', '3:11'], ['Go Your Own Way', '3:38'], ['Songbird', '3:20']];
return {
songs: titles.map(([title, len], i) => ({
n: String(i + 1), title, len,
numColor: i + 1 === playing ? '#8E9BFF' : '#7E7C78',
titleColor: i + 1 === playing ? '#8E9BFF' : '#F3F1EC'
}))
};
}
}
</script>

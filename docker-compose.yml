# Example stack for Murmur. Change the /path/to/... folders, then run `docker compose up -d`.
# See docs/GETTING_STARTED.md.
services:
  murmur:
    # Published by .github/workflows/release.yml when a v* tag is pushed.
    image: ghcr.io/gholaday/murmur:0.11.0
    container_name: murmur
    restart: unless-stopped
    ports:
      - '3333:3000'
    environment:
      - TZ=UTC
      # Files in /data and /cache are owned by this user and group. Use your own ids (run `id`).
      - PUID=1000
      - PGID=1000
      # Space for cached podcast episodes, in GB.
      - EPISODE_CACHE_MAX_GB=20
    # Keys and the add-on secret go in murmur.env beside this file (copy murmur.env.example), so
    # this file holds no secrets and can be shared when asking for help. Without it Murmur starts
    # with none: no TMDB details, and the add-ons off.
    env_file:
      - path: ./murmur.env
        required: false
    # Murmur needs no special powers. It starts as root only to give /data and /cache to PUID:PGID,
    # then runs as that user; these three capabilities are all that step uses.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /path/to/audiobooks:/audiobooks:ro
      # Music (optional): uncomment to turn on the Music tab.
      # - /path/to/music:/music:ro
      # Movies and shows (optional): uncomment to turn on the Watch tab, with murmur-video below.
      # - /path/to/movies:/movies:ro
      # - /path/to/shows:/shows:ro
      - /path/to/murmur/data:/data
      # Cached podcast episodes.
      - /path/to/murmur/cache:/cache
    # `default` is how players (and a proxy or tunnel) reach Murmur; `addons` is the private
    # network only Murmur and murmur-video are on.
    networks:
      - default
      - addons
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # Optional ad detection add-on. Uncomment to use; needs ADDON_SECRET and a Gemini API key from
  # aistudio.google.com in murmur.env. Without it Murmur works the same, just without ad marks. It
  # opens no ports: it only calls Murmur inside the stack, and Gemini and Groq.
  # murmur-adscan:
  #   image: ghcr.io/gholaday/murmur-adscan:0.11.0
  #   container_name: murmur-adscan
  #   restart: unless-stopped
  #   depends_on:
  #     murmur:
  #       condition: service_healthy
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - MURMUR_URL=http://murmur:3000
  #   # The same file as Murmur's: ADDON_SECRET, GEMINI_API_KEY and, optionally, GROQ_API_KEY.
  #   env_file:
  #     - path: ./murmur.env
  #       required: false
  #   cap_drop: [ALL]
  #   cap_add: [CHOWN, SETUID, SETGID]
  #   security_opt: ["no-new-privileges:true"]
  #   volumes:
  #     # The same folder as Murmur's /cache above, read-only.
  #     - /path/to/murmur/cache:/cache:ro
  #     - /path/to/murmur/adscan:/state
  #   # Keeps transcription from crowding out Murmur on a small server.
  #   cpus: "2"
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  # Optional movies and shows add-on: it reads the video files and streams them. Uncomment with the
  # movie and show folders above; needs ADDON_SECRET in murmur.env. Without it the Watch tab stays empty.
  # murmur-video:
  #   image: ghcr.io/gholaday/murmur-video:0.11.0
  #   container_name: murmur-video
  #   restart: unless-stopped
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     # Video conversion on the GPU: auto finds one (uncomment devices below), off keeps it on the CPU.
  #     - WATCH_HW=auto
  #   # The same file as Murmur's, for ADDON_SECRET.
  #   env_file:
  #     - path: ./murmur.env
  #       required: false
  #   cap_drop: [ALL]
  #   cap_add: [CHOWN, SETUID, SETGID]
  #   security_opt: ["no-new-privileges:true"]
  #   volumes:
  #     # The same folders, at the same paths, as Murmur's.
  #     - /path/to/movies:/movies:ro
  #     - /path/to/shows:/shows:ro
  #     # Stream pieces and downloads being made; only a few minutes of each stream is kept.
  #     - /path/to/murmur/video-cache:/cache
  #   # An Intel or AMD GPU for video conversion (Quick Sync on most Asustor, Synology and QNAP x86 boxes).
  #   # devices:
  #   #   - /dev/dri:/dev/dri
  #   # Only on the private network, with no ports: nothing outside the stack (a tunnel included) can
  #   # reach it, and it can't reach the internet, which it doesn't need. Never add `ports:` here.
  #   networks:
  #     - addons
  #   # Keeps video conversion from crowding out Murmur on a small server: leave at least one core
  #   # for Murmur and the system. ffmpeg's threads are sized to this limit.
  #   cpus: "4"
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

networks:
  # Murmur and murmur-video only. `internal` means no way in or out except between them.
  addons:
    internal: true

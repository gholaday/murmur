packages:
  - apps/*
  - packages/*
  - addons/*

# Refuse npm versions published less than seven days ago (in minutes), so a hijacked release is
# usually caught and pulled before it can be installed here.
minimumReleaseAge: 10080

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp

patchedDependencies:
  expo-audio@58.0.9: patches/expo-audio@58.0.9.patch
  expo-router@58.0.23: patches/expo-router@58.0.23.patch
  expo-video@58.0.13: patches/expo-video@58.0.13.patch
  react-native-google-cast@4.9.1: patches/react-native-google-cast@4.9.1.patch

# Paste into a Portainer stack. It runs once and stops; the report is in the container's log
# and in ./adscan-bench-out (report.md plus every transcript).
services:
  adscan-bench:
    image: ghcr.io/gholaday/murmur-adbench:latest
    restart: "no"
    environment:
      EPISODE_URL: "https://pscrb.fm/rss/p/traffic.megaphone.fm/ONESD2909368717.mp3"
      CLIP_MINUTES: "30"
      # GEMINI_API_KEY: "your key from aistudio.google.com"
      # GROQ_API_KEY: "your key from console.groq.com"
    volumes:
      - ./adscan-bench-out:/out

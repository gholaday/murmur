name: Ad benchmark image

# Publishes ghcr.io/<owner>/murmur-adbench:latest (amd64) when tools/adscan-bench changes.
on:
  push:
    branches: [main]
    paths: ["tools/adscan-bench/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: tools/adscan-bench
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/murmur-adbench:latest
          cache-from: type=gha,scope=adbench
          cache-to: type=gha,mode=max,scope=adbench

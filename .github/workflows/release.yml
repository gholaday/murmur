name: Release image

# Push a tag like v0.1.0 to publish ghcr.io/<owner>/murmur:0.1.0 for amd64 and arm64,
# and the signed Android app as murmur-0.1.0.apk on the GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

# Each image and the APK get a signed build provenance attestation, so anyone can check they were
# built here from a tag: `gh attestation verify oci://ghcr.io/gholaday/murmur:<version> -R gholaday/murmur`.
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/murmur
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MURMUR_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/murmur
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The optional ad detection add-on, released with the same version as Murmur.
  adscan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/murmur-adscan
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: addons/adscan
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ADSCAN_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=adscan
          cache-to: type=gha,mode=max,scope=adscan
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/murmur-adscan
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The optional movies and shows add-on, built from the repo root since it shares packages/shared.
  video:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/murmur-video
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: addons/video/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MURMUR_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=video
          cache-to: type=gha,mode=max,scope=video
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/murmur-video
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The Android app, built here with no secrets: the build runs code from npm and Gradle plugins,
  # so it never sees the signing key. Without the key, release builds use the debug key, and the
  # sign job below re-signs the APK.
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: pnpm install --frozen-lockfile
      # The tag sets the app's version. versionCode has to grow with every release:
      # 0.2.5 becomes 205, 1.0.0 becomes 10000.
      - name: Set the app version
        run: |
          node -e '
            const fs = require("fs");
            const version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const [major, minor, patch] = version.split(".").map(Number);
            const file = "apps/mobile/app.json";
            const app = JSON.parse(fs.readFileSync(file, "utf8"));
            app.expo.version = version;
            app.expo.android.versionCode = major * 10000 + minor * 100 + patch;
            fs.writeFileSync(file, JSON.stringify(app, null, 2));
          '
      - name: Generate the Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install
      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  # Signs the APK with Murmur's release key and attaches it to the GitHub release, where
  # Obtainium picks it up. It's the only job that reads the key, and it runs in the `release`
  # environment, which only v* tags can use. It runs no npm or Gradle code, only GitHub's own
  # actions and the Android SDK's apksigner. Needs the ANDROID_KEYSTORE_BASE64,
  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets.
  sign:
    needs: apk
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release notes link to the commits since the previous tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
          path: ${{ runner.temp }}/apk
      # apksigner replaces the debug signature. The keystore is written to the runner's temp
      # folder and removed straight after.
      - name: Sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          # Without the secrets the release stops here, rather than publishing a debug-signed APK.
          test -n "$KEYSTORE_BASE64" || { echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          # The newest stable build tools; -P 16 needs 35 or later.
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | grep -v -- '-rc' | sort -V | tail -1)
          keystore="$RUNNER_TEMP/murmur.jks"
          trap 'rm -f "$keystore"' EXIT
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$tools/zipalign" -f -P 16 4 "$RUNNER_TEMP/apk/app-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --v4-signing-enabled false \
            --out "murmur-${GITHUB_REF_NAME#v}.apk" "$RUNNER_TEMP/aligned.apk"
          # Exactly one signer, Murmur's: the debug signature must be gone.
          "$tools/apksigner" verify --print-certs "murmur-${GITHUB_REF_NAME#v}.apk" | tee "$RUNNER_TEMP/certs.txt"
          test "$(grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/certs.txt" | sed 's/.*digest: //' | sort -u | wc -l)" = 1 \
            || { echo "::error::The APK should have exactly one signer"; exit 1; }
          ! grep -q 'CN=Android Debug' "$RUNNER_TEMP/certs.txt" \
            || { echo "::error::The APK is still signed with the debug key"; exit 1; }
          # This guards the key, not the build: the APK comes from a job that runs npm and Gradle
          # code. Its hash goes in the run summary so a bad build can be traced later.
          echo "APK SHA-256: \`$(sha256sum "murmur-${GITHUB_REF_NAME#v}.apk" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"
      # Check a download with: gh attestation verify murmur-<version>.apk -R gholaday/murmur
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: murmur-*.apk
      # Settings' What's new opens this release, so its notes are the "Release x.y.z" commit's
      # plain description of the changes. Without one, GitHub's generated notes.
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          apk="murmur-$VERSION.apk"
          bash .github/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then notes=(--notes-file "$RUNNER_TEMP/notes.md"); else notes=(--generate-notes); fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            if [ -s "$RUNNER_TEMP/notes.md" ]; then gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"; fi
          else
            gh release create "$GITHUB_REF_NAME" --title "$VERSION" "${notes[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
